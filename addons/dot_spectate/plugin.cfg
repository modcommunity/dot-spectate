name="dot-spectate"
description="Who is watching whom, what the server lets them watch, and where the camera is: Source's seven observer modes, mp_forcecamera's policy, a death-cam/freeze-cam/hand-over chain, and a SourceTV-style delay so a spectator is not a live intelligence feed. Computes a transform and touches no camera. Depends only on dot-core."
